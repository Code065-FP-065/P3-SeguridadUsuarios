<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Resumen general del sistema</p>
    </section>

    <section class="stats-grid">
        <article class="stat-card">
            <p class="stat-card__label">Total clientes</p>
            <h2 class="stat-card__value" th:text="${totalClientes}">0</h2>
        </article>

        <article class="stat-card">
            <p class="stat-card__label">Total vehículos</p>
            <h2 class="stat-card__value" th:text="${totalVehiculos}">0</h2>
        </article>

        <article class="stat-card">
            <p class="stat-card__label">Total alquileres</p>
            <h2 class="stat-card__value" th:text="${totalAlquileres}">0</h2>
        </article>
    </section>

    <section class="dashboard-grid">
        <div class="card">
            <div class="card__header">
                <h3 class="card__title">Accesos rápidos</h3>
            </div>

            <div class="card__body quick-actions__list">
                <a th:href="@{/clientes/nuevo}" class="quick-action-btn">Crear cliente</a>
                <a th:href="@{/vehiculos/nuevo}" class="quick-action-btn">Crear vehículo</a>
                <a th:href="@{/alquileres/nuevo}" class="quick-action-btn">Crear alquiler</a>
            </div>
        </div>

        <aside class="card quick-actions">
            <div class="card__header">
                <h3 class="card__title">Navegación</h3>
            </div>

            <div class="card__body quick-actions__list">
                <a th:href="@{/clientes}" class="quick-action-btn">Ir a clientes</a>
                <a th:href="@{/vehiculos}" class="quick-action-btn">Ir a vehículos</a>
                <a th:href="@{/alquileres}" class="quick-action-btn">Ir a alquileres</a>
            </div>
        </aside>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
