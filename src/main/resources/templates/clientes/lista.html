<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Clientes</h1>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="toolbar">
        <a th:href="@{/clientes/nuevo}" class="btn btn--primary">Nuevo cliente</a>

        <!-- PARA IMPLEMENTAR MÁS ADELANTE
        <div class="toolbar__search">
            <input type="text" placeholder="Buscar por nombre, email o DNI">
        </div>

        <div class="toolbar__filter">
            <select>
                <option>Todos</option>
            </select>
        </div>
        -->
    </section>

    <section class="card">
        <div class="card__body card__body--no-padding">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Fecha alta</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.idCliente}">1</td>
                    <td th:text="${cliente.nombre}">María</td>
                    <td th:text="${cliente.apellidos}">García López</td>
                    <td th:text="${cliente.dni}">12345678A</td>
                    <td th:text="${cliente.telefono}">+34 612 345 678</td>
                    <td th:text="${#temporals.format(cliente.createdAt, 'yyyy-MM-dd')}">2024-01-15</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <div class="table-actions">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}" class="icon-action">Editar</a>

                            <form th:action="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}" method="post" style="display:inline;">
                                <button type="submit" class="icon-action icon-action--danger"
                                        onclick="return confirm('¿Eliminar este cliente?')">Eliminar</button>
                            </form>
                        </div>
                    </td>

                    <td sec:authorize="!hasRole('ADMIN')">
                        <span class="badge badge--info">Solo lectura</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
