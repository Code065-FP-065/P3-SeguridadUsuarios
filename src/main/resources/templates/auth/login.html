<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Iniciar sesión</h1>
        <p class="page-subtitle">Accede a la aplicación con tu usuario</p>
    </section>

    <section class="card">
        <div class="card__body">
            <div th:if="${param.error}" class="alert alert--error">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert alert--success">
                Has cerrado sesión correctamente.
            </div>

            <div th:if="${param.registroExitoso}" class="alert alert--success">
                Registro completado. Ya puedes iniciar sesión.
            </div>

            <form th:action="@{/login}" method="post" class="form-layout">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" name="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" name="password" class="form-control" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Entrar</button>
                    <a th:href="@{/registro}" class="btn btn--outline">Crear cuenta</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
