<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Iniciar sesion</h1>
        <p class="page-subtitle">Accede con tu usuario</p>
    </section>

    <div class="alert alert--error" th:if="${param.error}">Usuario o contrasena incorrectos.</div>
    <div class="alert alert--success" th:if="${param.logout}">Has cerrado sesion correctamente.</div>
    <div class="alert alert--success" th:if="${param.registroOk}">Registro completado. Ya puedes iniciar sesion.</div>

    <section class="card form-card">
        <div class="card__body">
            <form th:action="@{/login}" method="post" class="form-grid">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" name="username" placeholder="Tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input id="password" type="password" name="password" placeholder="Tu contrasena" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Entrar</button>
                    <a th:href="@{/registro}" class="btn btn--outline">Crear cuenta</a>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
