<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Registro</h1>
        <p class="page-subtitle">Crea tu usuario para acceder</p>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="card form-card">
        <div class="card__body">
            <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="form-grid">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" th:field="*{username}" placeholder="Nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nombre y apellidos" required>
                </div>

                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input id="password" type="password" th:field="*{password}" placeholder="Contrasena" required>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Confirmar contrasena</label>
                    <input id="confirmarPassword" type="password" th:field="*{confirmarPassword}" placeholder="Repite la contrasena" required>
                </div>

                <div class="form-actions">
                    <a th:href="@{/login}" class="btn btn--outline">Volver</a>
                    <button type="submit" class="btn btn--primary">Crear cuenta</button>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
