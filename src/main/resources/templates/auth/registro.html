<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Registro de usuario</h1>
        <p class="page-subtitle">Crea tu cuenta y tu perfil de cliente</p>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="card">
        <div class="card__body">
            <form th:action="@{/registro}" th:object="${registroUsuarioDto}" method="post" class="form-layout">

                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input id="username" type="text" th:field="*{username}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="repetirPassword">Repetir contraseña</label>
                    <input id="repetirPassword" type="password" th:field="*{repetirPassword}" class="form-control" required>
                </div>

                <hr>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" type="text" th:field="*{apellidos}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input id="dni" type="text" th:field="*{dni}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="text" th:field="*{telefono}" class="form-control" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Registrarse</button>
                    <a th:href="@{/login}" class="btn btn--outline">Volver al login</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
