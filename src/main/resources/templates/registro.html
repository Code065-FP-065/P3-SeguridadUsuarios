<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="card" style="max-width: 500px; margin: 40px auto; padding: 20px;">
        <div class="card__header">
            <h1 class="page-title">Crear Nueva Cuenta</h1>
        </div>

        <div class="card__body">
            <form th:action="@{/registro}" th:object="${usuario}" method="post" class="form">
                <div class="form-group">
                    <label class="form-label">Nombre de usuario</label>
                    <input type="text" th:field="*{username}" class="form-control" required />
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required />
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{passwordHash}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn--primary" style="margin-top: 25px; width: 100%;">
                    Finalizar Registro
                </button>
            </form>
        </div>

        <div class="card__footer" style="text-align: center; margin-top: 15px;">
            <p>¿Ya tienes cuenta? <a th:href="@{/login}" class="link">Inicia sesión</a></p>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
