<nav th:fragment="nav"
     class="main-nav"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="main-nav__container">

        <a th:href="@{/}"
           th:classappend="${paginaActiva == 'dashboard'} ? ' main-nav__link--active' : ''"
           class="main-nav__link">
            Inicio
        </a>

        <!-- Menú visible solo para usuarios autenticados -->
        <a sec:authorize="isAuthenticated()"
           th:href="@{/clientes}"
           th:classappend="${paginaActiva == 'clientes'} ? ' main-nav__link--active' : ''"
           class="main-nav__link">
            Clientes
        </a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/vehiculos}"
           th:classappend="${paginaActiva == 'vehiculos'} ? ' main-nav__link--active' : ''"
           class="main-nav__link">
            Vehículos
        </a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/alquileres}"
           th:classappend="${paginaActiva == 'alquileres'} ? ' main-nav__link--active' : ''"
           class="main-nav__link">
            Alquileres
        </a>

        <!-- Enlace visible solo si NO hay sesión iniciada -->
        <a sec:authorize="isAnonymous()"
           th:href="@{/login}"
           th:classappend="${paginaActiva == 'login'} ? ' main-nav__link--active' : ''"
           class="main-nav__link">
            Iniciar sesión
        </a>

    </div>
</nav>
