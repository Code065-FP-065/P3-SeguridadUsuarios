<header th:fragment="header" class="topbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="topbar__container">
        <div class="topbar__brand">
            <a th:href="@{/}" class="brand-link">AlquilerVehiculos</a>
        </div>
        <div class="topbar__right" sec:authorize="isAuthenticated()">
            <div class="topbar__user">
                <span class="topbar__user-icon">○</span>
                <span sec:authentication="name">usuario</span>
            </div>

            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn--outline btn--small">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>
