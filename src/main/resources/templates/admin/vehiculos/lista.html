<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Vehículos')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Vehículos</h1>
        <p class="page-subtitle">Gestión de vehículos</p>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="toolbar">
        <a th:href="@{/admin/vehiculos/nuevo}" class="btn btn--primary">Nuevo vehículo</a>
    </section>

    <section class="card">
        <div class="card__body card__body--no-padding">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Matrícula</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Tipo</th>
                    <th>Precio/día</th>
                    <th>Estado</th>
                    <th>Fecha alta</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(vehiculos)}">
                    <td colspan="9">No hay vehículos registrados.</td>
                </tr>
                <tr th:each="vehiculo : ${vehiculos}">
                    <td th:text="${vehiculo.idVehiculo}">1</td>
                    <td th:text="${vehiculo.matricula}">1234ABC</td>
                    <td th:text="${vehiculo.marca}">Toyota</td>
                    <td th:text="${vehiculo.modelo}">Corolla</td>
                    <td th:text="${vehiculo.tipo}">Turismo</td>
                    <td th:text="${vehiculo.precioDia}">45.00</td>
                    <td th:text="${vehiculo.estado}">DISPONIBLE</td>
                    <td th:text="${vehiculo.createdAt != null ? #temporals.format(vehiculo.createdAt, 'yyyy-MM-dd') : '-'}">2026-03-27</td>
                    <td>
                        <div class="table-actions">
                            <a th:href="@{/admin/vehiculos/editar/{id}(id=${vehiculo.idVehiculo})}" class="icon-action">Editar</a>

                            <form th:action="@{/admin/vehiculos/eliminar/{id}(id=${vehiculo.idVehiculo})}"
                                  method="post"
                                  class="inline-form"
                                  onsubmit="return confirm('¿Seguro que deseas eliminar este vehículo?');">
                                <button type="submit" class="icon-action icon-action--danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
