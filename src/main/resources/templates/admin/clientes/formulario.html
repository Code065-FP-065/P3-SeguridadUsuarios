<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Formulario cliente')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title"
            th:text="${cliente.idCliente != null} ? 'Editar cliente' : 'Nuevo cliente'">
            Formulario cliente
        </h1>
        <p class="page-subtitle">Alta y edición de clientes</p>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="card">
        <div class="card__body">
            <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post" class="form-layout">

                <input type="hidden" th:field="*{idCliente}">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" type="text" th:field="*{apellidos}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input id="dni" type="text" th:field="*{dni}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="text" th:field="*{telefono}" class="form-control" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Guardar</button>
                    <a th:href="@{/admin/clientes}" class="btn btn--outline">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
