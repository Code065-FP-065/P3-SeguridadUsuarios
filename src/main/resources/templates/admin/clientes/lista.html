<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle">Gestión de clientes</p>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="toolbar">
        <a th:href="@{/admin/clientes/nuevo}" class="btn btn--primary">Nuevo cliente</a>
    </section>

    <section class="card">
        <div class="card__body card__body--no-padding">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Fecha alta</th>
                    <th>Usuario vinculado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.idCliente}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellidos}"></td>
                    <td th:text="${cliente.dni}"></td>
                    <td th:text="${cliente.telefono}"></td>
                    <td th:text="${cliente.createdAt != null ? #temporals.format(cliente.createdAt, 'yyyy-MM-dd') : '-'}"></td>
                    <td th:text="${cliente.usuario != null ? cliente.usuario.username : 'Sin usuario'}"></td>
                    <td>
                        <div class="table-actions">
                            <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.idCliente})}" class="icon-action">Editar</a>

                            <form th:action="@{/admin/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                  method="post"
                                  class="inline-form"
                                  onsubmit="return confirm('¿Seguro que deseas eliminar este cliente?');">
                                <button type="submit" class="icon-action icon-action--danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
